name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.html'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Inline matrix: replaces the previous status-im/nimbus-common-workflow
  # caller so we can mark devel as informational with continue-on-error
  # (GitHub forbids that field on `uses:` reusable-workflow jobs).
  #
  # Nim 2.0.x is unsupported (refc + foreign-thread regression on macOS;
  # see README). 2.2.4 and 2.2.12 both gate PRs; devel is per-matrix-entry
  # continue-on-error so upstream regressions don't block merges.
  #
  # Linux gcc-14 and other architectures (raspberry-pi / android) are
  # planned as later phases.
  build:
    name: ${{ matrix.platform.id }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.platform.runs-on }}
    continue-on-error: ${{ matrix.nim == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        nim: ["2.2.4", "2.2.12", "devel"]
        platform:
          - { id: linux-amd64,  runs-on: ubuntu-latest }
          - { id: win-amd64,    runs-on: windows-latest }
          - { id: macos-arm64,  runs-on: macos-latest }
          - { id: macos-amd64,  runs-on: macos-15-intel  }
        exclude:
          # jiro4989/setup-nim-action does not support installing Nim devel
          # on Windows. Manual devel verification on Windows stays available
          # via memcheck_ci.yml workflow_dispatch.
          - nim: "devel"
            platform: { id: win-amd64, runs-on: windows-latest }
          # Frees a macOS slot (5 concurrent per account) for the
          # sanitizers-macos job; macos-arm64/devel still covers devel.
          - nim: "devel"
            platform: { id: macos-amd64, runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure clang in PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # nimWindowsCcFlag in brokers.nimble forces --cc:clang for FFI
          # builds (CRT alignment with the cmake side). LLVM ships at
          # C:\Program Files\LLVM\bin on windows-latest but is not on
          # PATH by default.
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            Write-Host "Found LLVM at $llvmBin"
            echo $llvmBin >> $env:GITHUB_PATH
          } else {
            Write-Host "LLVM not found, installing via choco..."
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Show tool versions
        shell: bash
        run: |
          nim --version
          nimble --version
          cmake --version
          python3 --version || python --version || true

      - name: Install dependencies
        shell: bash
        run: |
          nimble setup -l
          nimble install -d -y

      - name: Run nimble test
        shell: bash
        run: ci/nimble-strict.sh test --verbose

      - name: Run teardown UAF gate (Windows)
        # Repeated-run reproducer harness for the worker-thread teardown UAF
        # (see teardownBrokerThread in brokers/internal/mt_broker_common.nim
        # and doc/LIMITATION.md §2.2). Pre-fix crash rate was ~30% per run on
        # these runners under refc+release; the gate fails on ANY crash in
        # 40 trials per variant. Windows-only: the detonation mechanism is
        # the Win32 RegisterWaitForSingleObject wait-thread path.
        if: runner.os == 'Windows'
        shell: bash
        run: ci/nimble-strict.sh testAllocRace --verbose

      - name: Run nimble testApi
        # Nim-side API matrix (codec + library init + event subscribe +
        # discovery API + typemappingtestlib parity). Doesn't compile
        # any C++ consumer, so no jsoncons fetch is needed here — that's
        # only required by the `examples` job below.
        shell: bash
        run: ci/nimble-strict.sh testApi --verbose

  examples:
    runs-on: ubuntu-latest
    env:
      NIM_VERSION: '2.2.12'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (nimble)
        run: nimble install -d -y

      - name: Show tool versions
        run: |
          nim --version
          nimble --version
          cmake --version
          python3 --version

      - name: Install Python cbor2 (Python wrapper dep)
        run: python3 -m pip install --user cbor2

      - name: Fetch jsoncons (C++ wrapper dep)
        run: |
          if [ ! -d vendor/jsoncons ]; then
            git clone --depth 1 --branch v1.0.0 \
              https://github.com/danielaparker/jsoncons.git vendor/jsoncons
          fi

      - name: Run C++ FFI example
        run: ci/nimble-strict.sh runFfiExampleCpp -y --verbose

      - name: Run Python FFI example
        run: ci/nimble-strict.sh runFfiExamplePy -y --verbose

      - name: Run Python parity matrix
        run: ci/nimble-strict.sh runTypeMapTestLibPy -y --verbose

      - name: Run EXTAPI Python example
        run: ci/nimble-strict.sh runExtExamplePy -y --verbose

      - name: Run EXTAPI Python wrapper tests
        run: ci/nimble-strict.sh testExtPyWrapper -y --verbose

      - name: Run C++ parity matrix
        run: ci/nimble-strict.sh runTypeMapTestLibCpp -y --verbose

      # EXTAPI C++ examples (plugin, runtime switching, mocking, C import, lib
      # mode). Windows: the `examples-windows` job.
      - name: Run EXTAPI C++ examples
        run: ci/nimble-strict.sh runExtExampleCpp -y --verbose

      - name: Set up Rust toolchain (stable, MSRV 1.75)
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust FFI example
        run: ci/nimble-strict.sh runFfiExampleRust -y --verbose

      - name: Run Rust parity matrix
        run: ci/nimble-strict.sh runTypeMapTestLibRust -y --verbose

      - name: Run EXTAPI Rust examples
        run: ci/nimble-strict.sh runExtExampleRust -y --verbose

      - name: Run EXTAPI Rust wrapper tests
        run: ci/nimble-strict.sh testExtRustWrapper -y --verbose

      - name: Set up Go toolchain (1.21)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Go FFI example
        run: ci/nimble-strict.sh runFfiExampleGo -y --verbose

      - name: Run Go parity matrix
        run: ci/nimble-strict.sh runTypeMapTestLibGo -y --verbose

      - name: Run EXTAPI Go examples
        run: ci/nimble-strict.sh runExtExampleGo -y --verbose

      # OOP interface-model examples (hierlib + persistence)
      - name: Run hierlib C++ example
        run: ci/nimble-strict.sh runHierExampleCpp -y --verbose

      - name: Run hierlib Python example
        run: ci/nimble-strict.sh runHierExamplePy -y --verbose

      - name: Run hierlib Rust example
        run: ci/nimble-strict.sh runHierExampleRust -y --verbose

      - name: Run hierlib Go example
        run: ci/nimble-strict.sh runHierExampleGo -y --verbose

      - name: Run persistence C++ example
        run: ci/nimble-strict.sh runPersistenceExampleCpp -y --verbose

      - name: Run persistence Python example
        run: ci/nimble-strict.sh runPersistenceExamplePy -y --verbose

      - name: Run persistence Rust example
        run: ci/nimble-strict.sh runPersistenceExampleRust -y --verbose

      - name: Run persistence Go example
        run: ci/nimble-strict.sh runPersistenceExampleGo -y --verbose

  # EXTAPI examples + wrapper harnesses on Windows (LoadLibrary plugins, lib
  # mode DLLs, clang-built Nim + cmake/Ninja/clang C++, MSVC Rust, MinGW cgo).
  # Every step runs (`if: always()`) so one run reports all failures; the job
  # still fails if any does.
  examples-windows:
    runs-on: windows-latest
    env:
      NIM_VERSION: '2.2.12'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure clang in PATH
        shell: pwsh
        run: |
          # nimWindowsCcFlag forces --cc:clang for the FFI / EXTAPI builds.
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            echo $llvmBin >> $env:GITHUB_PATH
          } else {
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Install dependencies (nimble)
        shell: bash
        run: |
          nimble setup -l
          nimble install -d -y

      - name: Install Python cbor2 (Python wrapper dep)
        shell: bash
        run: python -m pip install --user cbor2

      - name: Fetch jsoncons (C++ wrapper dep)
        shell: bash
        run: |
          if [ ! -d vendor/jsoncons/include ]; then
            rm -rf vendor/jsoncons
            git clone --depth 1 --branch v1.0.0 \
              https://github.com/danielaparker/jsoncons.git vendor/jsoncons
          fi

      - name: Set up Rust toolchain (stable, MSRV 1.75)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go toolchain (1.21)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Show tool versions
        shell: bash
        run: |
          nim --version
          nimble --version
          cmake --version
          clang --version
          gcc --version || true
          python --version
          cargo --version
          go version

      - name: Run EXTAPI Python example
        if: always()
        shell: bash
        run: ci/nimble-strict.sh runExtExamplePy -y --verbose

      - name: Run EXTAPI Python wrapper tests
        if: always()
        shell: bash
        run: ci/nimble-strict.sh testExtPyWrapper -y --verbose

      - name: Run EXTAPI C++ examples
        if: always()
        shell: bash
        run: ci/nimble-strict.sh runExtExampleCpp -y --verbose

      - name: Run EXTAPI Rust examples
        if: always()
        shell: bash
        run: ci/nimble-strict.sh runExtExampleRust -y --verbose

      - name: Run EXTAPI Rust wrapper tests
        if: always()
        shell: bash
        run: ci/nimble-strict.sh testExtRustWrapper -y --verbose

      - name: Run EXTAPI Go examples
        if: always()
        shell: bash
        run: ci/nimble-strict.sh runExtExampleGo -y --verbose

  # EXTAPI under the sanitizers (clang, debug): the four EXTAPI test files on
  # orc and refc under ASan+UBSan, TSan and ASan+LSan (leaks, Linux), and the
  # C++ examples with an instrumented Nim host. The same
  # tasks are in `allAsan` (manual memcheck_ci.yml); this job runs them on
  # every push / PR. Every step runs (`if: always()`).
  # Sanitizer suite (`sanRows` in brokers.nimble). Linux runs everything:
  # asanleak = ASan+UBSan+LSan in one build, plus TSan. macOS / Windows run
  # the shallow, platform-sensitive subset (SAN_SHALLOW=1).
  sanitizers-linux:
    name: sanitizers-linux / ${{ matrix.mode }} / ${{ matrix.groups }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: asanleak, task: allAsanLeak, groups: st }
          - { mode: asanleak, task: allAsanLeak, groups: mt }
          - { mode: asanleak, task: allAsanLeak, groups: api, extra: sanitizePersistenceCppAsan }
          - { mode: asanleak, task: allAsanLeak, groups: ext, extra: runExtExampleCppAsan }
          - { mode: tsan, task: allTsan, groups: mt }
          - { mode: tsan, task: allTsan, groups: api, extra: sanitizePersistenceCppTsan }
          - { mode: tsan, task: allTsan, groups: ext }
    env:
      NIM_VERSION: '2.2.12'
      SAN_GROUPS: ${{ matrix.groups }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang + llvm-symbolizer
        run: sudo apt-get update -qq && sudo apt-get install -y clang llvm

      - name: Install dependencies (nimble)
        run: nimble install -d -y

      - name: Fetch jsoncons (C++ wrapper dep)
        run: |
          if [ ! -d vendor/jsoncons/include ]; then
            rm -rf vendor/jsoncons
            git clone --depth 1 --branch v1.0.0 \
              https://github.com/danielaparker/jsoncons.git vendor/jsoncons
          fi

      - name: ${{ matrix.task }} (${{ matrix.groups }})
        run: ci/nimble-strict.sh ${{ matrix.task }} -y --verbose

      - name: ${{ matrix.extra }}
        if: always() && matrix.extra
        run: ci/nimble-strict.sh ${{ matrix.extra }} -y --verbose

  sanitizers-macos:
    runs-on: macos-latest
    env:
      NIM_VERSION: '2.2.12'
      SAN_SHALLOW: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (nimble)
        run: nimble install -d -y

      - name: Fetch jsoncons (C++ wrapper dep)
        run: |
          if [ ! -d vendor/jsoncons/include ]; then
            rm -rf vendor/jsoncons
            git clone --depth 1 --branch v1.0.0 \
              https://github.com/danielaparker/jsoncons.git vendor/jsoncons
          fi

      - name: allAsan (shallow)
        run: ci/nimble-strict.sh allAsan -y --verbose

      - name: allTsan (shallow)
        if: always()
        run: ci/nimble-strict.sh allTsan -y --verbose

  sanitizers-windows:
    # ASan+UBSan only: clang has no TSan / LSan on Windows.
    runs-on: windows-latest
    env:
      NIM_VERSION: '2.2.12'
      SAN_SHALLOW: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure clang + ASan runtime in PATH
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            choco install llvm -y --no-progress
          }
          echo $llvmBin >> $env:GITHUB_PATH
          # The ASan exe links clang_rt.asan_dynamic-x86_64.dll, which lives
          # under LLVM\lib\clang\<ver>\lib\windows, not LLVM\bin. Without it
          # on PATH the test fails STATUS_DLL_NOT_FOUND with no stderr.
          $asan = Get-ChildItem "C:\Program Files\LLVM\lib\clang" `
            -Filter "clang_rt.asan_dynamic-x86_64.dll" `
            -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($asan) { echo $asan.DirectoryName >> $env:GITHUB_PATH }
          else { Write-Host "::warning::clang_rt.asan_dynamic-x86_64.dll not found" }

      - name: Install dependencies (nimble)
        shell: bash
        run: |
          nimble setup -l
          nimble install -d -y

      - name: Fetch jsoncons (C++ wrapper dep)
        shell: bash
        run: |
          if [ ! -d vendor/jsoncons/include ]; then
            rm -rf vendor/jsoncons
            git clone --depth 1 --branch v1.0.0 \
              https://github.com/danielaparker/jsoncons.git vendor/jsoncons
          fi

      # TEMPORARY (PR #67): locate the unresolved `__atomic_store` that breaks
      # the refc ASan link of test_api_library_init on clang/MSVC. Not
      # reproducible off the runner. Remove once the source is fixed.
      - name: "DIAG: __atomic_store source (test_api_library_init, refc)"
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          clang --version
          mkdir -p build/diag
          nim c --hints:off --cc:clang --debugger:native -d:nimUnittestOutputLevel:VERBOSE \
            -d:noSignalHandler -d:useMalloc --threads:on --mm:refc -d:brokerSanitizer=asan \
            -d:BrokerFfiApi --path:. --compileOnly --nimcache:build/diag/nc \
            --passC:"-fsanitize=address -fsanitize=undefined -fno-sanitize=function,vptr -fno-omit-frame-pointer -g -fsanitize-address-use-after-return=never -gcodeview" \
            test/test_api_library_init.nim
          python - <<'PY'
          import json, glob, re, subprocess
          meta = json.load(open(glob.glob("build/diag/nc/*.json")[0]))
          src, cmd = next(c for c in meta["compile"] if "@mtest_api_library_init.nim.c" in c[0])
          cmd = re.sub(r"\s-o\s+\S+", " ", cmd).replace(" -c ", " ").replace(" -w ", " ")
          for ext, extra in [("s", "-S"), ("ll", "-S -emit-llvm")]:
              out = f"build/diag/adapter.{ext}"
              full = f'{cmd} {extra} -Watomic-alignment -o "{out}"'
              print("::group::", full[:400]); r = subprocess.run(full, shell=True, capture_output=True, text=True)
              print(r.returncode, r.stderr[-4000:]); print("::endgroup::")
          asm = open("build/diag/adapter.s", errors="replace").read().splitlines()
          hits = [i for i, l in enumerate(asm) if "__atomic" in l and ("call" in l or "jmp" in l)]
          print("__atomic call sites:", len(hits))
          for i in hits[:5]:
              fn = next((asm[j] for j in range(i, -1, -1) if re.match(r"^[A-Za-z_?@$][^\s:]*:", asm[j])), "?")
              locs = [l.strip() for l in asm[max(0, i - 120):i] if ".cv_loc" in l][-6:]
              print("=== in", fn); print("\n".join(locs)); print("\n".join(asm[max(0, i - 25):i + 2]))
          files = [l.strip() for l in asm if l.strip().startswith(".cv_file")]
          print("\n".join(files[:200]))
          ll = open("build/diag/adapter.ll", errors="replace").read().splitlines()
          print("IR lines mentioning atomic:", sum("atomic" in l for l in ll))
          for l in ll:
              if re.search(r"\b(load|store) atomic|atomicrmw|cmpxchg|@__atomic", l): print("  ", l.strip()[:200])
          PY

      - name: "DIAG: upload generated C / IR / asm"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diag-atomic-store
          path: |
            build/diag/adapter.s
            build/diag/adapter.ll
            build/diag/nc/@mtest_api_library_init.nim.c
          if-no-files-found: warn

      - name: allAsan (shallow)
        shell: bash
        run: ci/nimble-strict.sh allAsan -y --verbose

  nph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check `nph` formatting
        uses: arnetheduck/nph-action@v1
        with:
          version: 0.7.0
