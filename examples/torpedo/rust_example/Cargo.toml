# Cargo manifest for the torpedo Rust FFI example.
#
#   cargo run   # builds against the FFI library in nimlib/build/

[package]
name = "torpedo_rust_example"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
# The generated wrapper is included as a module (`#[path]`), not linked as a
# crate, so its dependencies must be declared here too. Its async request
# surface bridges the C response callback to a runtime-agnostic oneshot.
futures-channel = "0.3"

[[bin]]
name = "torpedo_rust_example"
path = "src/main.rs"
