# EXTAPI example — scenario 1b in Rust: this application hosts the Nim library
# `storagelib` and implements the `notes` plugin it consumes, with the R4
# Builder. Both crates are generated by the Nim library build
# (`nimble runExtExampleRust`).

[package]
name = "storage_rust_host_lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
storagelib = { path = "../nimlib/build/storagelib_rs" }
notes_ext = { path = "../nimlib/build/notes_ext_rs" }

[[bin]]
name = "storage_rust_host_lib"
path = "src/main.rs"
